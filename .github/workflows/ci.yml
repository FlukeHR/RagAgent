name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff E9,F)
        run: ruff check .

      - name: Type check (mypy, 非阻断)
        continue-on-error: true
        run: |
          pip install mypy
          mypy --ignore-missing-imports --no-error-summary agent config llm tools indexing retrieval || true

      - name: Unit tests (离线，全 mock，不打网络/API)
        run: pytest tests/ -q
