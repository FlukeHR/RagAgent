<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paper RAG Agent</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  window.MathJax = {
    tex: {
      inlineMath: [["$", "$"], ["\\(", "\\)"]],
      displayMath: [["$$", "$$"], ["\\[", "\\]"]],
      processEnvironments: true,
    },
    options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] },
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --border: #e5e5e0; --text: #2d2d2a;
    --muted: #8a8a82; --accent: #c96442; --accent-soft: #f4e3dc; --user-bg: #ecebe6;
    --sidebar: #efeee9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header .title { font-weight: 600; font-size: 15px; }
  header .spacer { flex: 1; }
  header select, header button {
    font-size: 13px; padding: 6px 10px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--panel); color: var(--text); cursor: pointer;
  }
  header button:hover { background: var(--bg); }
  #toggle-sidebar { padding: 6px 9px; }

  /* 主体：侧栏 / 对话 */
  #body { flex: 1; display: flex; min-height: 0; }

  /* 会话侧栏 */
  #sidebar {
    width: 248px; flex-shrink: 0; background: var(--sidebar);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    transition: width .2s ease, opacity .2s ease; overflow: hidden;
  }
  body.nosidebar #sidebar { width: 0; opacity: 0; }
  #sidebar .side-head { padding: 12px; }
  #newchat {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 14px; padding: 10px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--panel); color: var(--text); cursor: pointer; white-space: nowrap;
  }
  #newchat:hover { border-color: var(--accent); color: var(--accent); }
  #sessions { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .session {
    display: flex; align-items: center; gap: 6px; padding: 9px 10px; margin-bottom: 2px;
    border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text);
    white-space: nowrap; overflow: hidden;
  }
  .session:hover { background: #e4e3dd; }
  .session.active { background: #ddd9cf; font-weight: 500; }
  .session .stitle { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .session .sdel {
    flex-shrink: 0; border: none; background: none; color: var(--muted);
    cursor: pointer; font-size: 15px; line-height: 1; opacity: 0; padding: 0 2px;
  }
  .session:hover .sdel { opacity: 1; }
  .session .sdel:hover { color: var(--accent); }
  .side-empty { padding: 16px 12px; color: var(--muted); font-size: 12px; }

  #chatpane { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  #chat { flex: 1; overflow-y: auto; padding: 24px 0; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }

  .empty-hint { color: var(--muted); text-align: center; margin-top: 18vh; font-size: 15px; }

  .msg { margin-bottom: 26px; }
  .msg .role { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .msg.user .bubble {
    background: var(--user-bg); border-radius: 14px; padding: 12px 16px;
    display: inline-block; white-space: pre-wrap; max-width: 100%;
  }
  .msg.assistant .bubble { line-height: 1.7; }
  .bubble p:first-child { margin-top: 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble pre { background: #f0f0ec; padding: 12px; border-radius: 8px; overflow-x: auto; }
  .bubble code { background: #f0f0ec; padding: 1px 5px; border-radius: 4px; }
  .bubble pre code { background: none; padding: 0; }

  .steps { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .steps summary { cursor: pointer; }
  .steps ul { margin: 6px 0 0; padding-left: 18px; }
  .tracetbl { margin: 6px 0 0; border-collapse: collapse; font-size: 12px; width: 100%; }
  .tracetbl td { padding: 3px 8px 3px 0; vertical-align: top; border-top: 1px solid var(--border); }
  .tracetbl td.tk {
    white-space: nowrap; color: var(--accent); font-weight: 600;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .typing { color: var(--muted); font-size: 14px; }

  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 0 18px; }
  .composer {
    max-width: 760px; margin: 0 auto; padding: 0 20px;
    display: flex; gap: 10px; align-items: flex-end;
  }
  .composer textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; font: inherit; font-size: 15px; line-height: 1.5;
    max-height: 200px; outline: none; background: var(--panel);
  }
  .composer textarea:focus { border-color: var(--accent); }
  .composer button {
    border: none; background: var(--accent); color: #fff; border-radius: 12px;
    width: 44px; height: 44px; font-size: 18px; cursor: pointer; flex-shrink: 0;
  }
  .composer button:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 760px; margin: 6px auto 0; padding: 0 20px; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <button id="toggle-sidebar" title="折叠/展开会话栏">☰</button>
    <span class="title">📚 Paper RAG Agent</span>
    <span class="spacer"></span>
  </header>

  <div id="body">
    <aside id="sidebar">
      <div class="side-head">
        <button id="newchat">＋ 新对话</button>
      </div>
      <div id="sessions"></div>
    </aside>

    <section id="chatpane">
      <div id="chat"><div class="wrap" id="messages"></div></div>
      <footer>
        <div class="composer">
          <textarea id="input" rows="1" placeholder="问点关于论文的问题…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button id="send" title="发送">↑</button>
        </div>
        <div class="hint">回答中的 [S编号] 对应真实检索来源。支持多轮追问（自动指代消解）。</div>
      </footer>
    </section>
  </div>

<script>
const API = "";
const $ = (id) => document.getElementById(id);
const messagesEl = $("messages");
const sessionsEl = $("sessions");

// ---------- 会话存储（多会话，纯前端 localStorage） ----------
const SESS_KEY = "rag_sessions";
const ACTIVE_KEY = "rag_active";
let sessions = [];
let activeId = null;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function loadStore() {
  try { sessions = JSON.parse(localStorage.getItem(SESS_KEY) || "[]"); } catch (_) { sessions = []; }
  // 迁移旧的单数组历史 rag_history -> 一个会话
  if (!sessions.length) {
    try {
      const old = JSON.parse(localStorage.getItem("rag_history") || "[]");
      if (old.length) {
        sessions = [{ id: uid(), title: "", messages: old, createdAt: Date.now(), updatedAt: Date.now() }];
        localStorage.removeItem("rag_history");
      }
    } catch (_) {}
  }
  activeId = localStorage.getItem(ACTIVE_KEY);
  if (!sessions.find(s => s.id === activeId)) activeId = sessions[0] && sessions[0].id;
  if (!sessions.length) newSession();
}

function saveStore() {
  localStorage.setItem(SESS_KEY, JSON.stringify(sessions));
  if (activeId) localStorage.setItem(ACTIVE_KEY, activeId);
}

function activeSession() { return sessions.find(s => s.id === activeId); }

function newSession() {
  const s = { id: uid(), title: "", messages: [], createdAt: Date.now(), updatedAt: Date.now() };
  sessions.unshift(s);
  activeId = s.id;
  saveStore();
}

function switchSession(id) {
  activeId = id;
  saveStore();
  renderSessions();
  render();
}

function deleteSession(id, ev) {
  ev.stopPropagation();
  sessions = sessions.filter(s => s.id !== id);
  if (activeId === id) activeId = sessions[0] && sessions[0].id;
  if (!sessions.length) newSession();
  saveStore();
  renderSessions();
  render();
}

// ---------- 渲染会话侧栏 ----------
function sessionLabel(s) {
  if (s.title) return s.title;
  const firstUser = s.messages.find(m => m.role === "user");
  return firstUser ? firstUser.content.slice(0, 16) : "新对话";
}

function renderSessions() {
  sessionsEl.innerHTML = "";
  if (!sessions.length) {
    sessionsEl.innerHTML = `<div class="side-empty">还没有对话</div>`;
    return;
  }
  sessions.forEach(s => {
    const div = document.createElement("div");
    div.className = "session" + (s.id === activeId ? " active" : "");
    div.innerHTML = `<span class="stitle"></span><button class="sdel" title="删除">×</button>`;
    div.querySelector(".stitle").textContent = sessionLabel(s);
    div.addEventListener("click", () => switchSession(s.id));
    div.querySelector(".sdel").addEventListener("click", (e) => deleteSession(s.id, e));
    sessionsEl.appendChild(div);
  });
}

// 把 LaTeX 公式段先挖出来占位，避免被 marked 当成 markdown 破坏，渲染后再放回
function protectMath(text, store) {
  const pats = [
    /\$\$[\s\S]+?\$\$/g, /\\\[[\s\S]+?\\\]/g,
    /\\begin\{[a-z*]+\}[\s\S]+?\\end\{[a-z*]+\}/g,
    /\$[^\$\n]+?\$/g, /\\\([\s\S]+?\\\)/g,
  ];
  for (const re of pats) {
    text = text.replace(re, (m) => { store.push(m); return `@@MATH${store.length - 1}@@`; });
  }
  return text;
}

function buildAnswerHtml(text) {
  let t = text || "";
  const math = [];
  t = protectMath(t, math);
  let html = marked.parse(t);
  html = html.replace(/@@MATH(\d+)@@/g, (m, i) => math[+i]);
  return html;
}

function typesetMath() {
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([messagesEl]).catch(() => {});
  }
}

// ---------- 渲染对话 ----------
function render() {
  const s = activeSession();
  const messages = s ? s.messages : [];
  messagesEl.innerHTML = "";
  if (!messages.length) {
    messagesEl.innerHTML = `<div class="empty-hint">开始一段新的论文问答 👋</div>`;
    return;
  }
  messages.forEach(m => {
    const div = document.createElement("div");
    div.className = `msg ${m.role}`;
    if (m.role === "user") {
      div.innerHTML = `<div class="role">你</div><div class="bubble"></div>`;
      div.querySelector(".bubble").textContent = m.content;
    } else {
      div.innerHTML = `<div class="role">助手</div><div class="bubble">${buildAnswerHtml(m.content)}</div>`;
      if (m.steps && m.steps.length) {
        const d = document.createElement("details");
        d.className = "steps";
        d.innerHTML = `<summary>🔎 检索步骤 (${m.steps.length})</summary><ul>${m.steps.map(s => `<li>${escapeHtml(s)}</li>`).join("")}</ul>`;
        div.appendChild(d);
      }
      if (m.trace && m.trace.length) {
        const d = document.createElement("details");
        d.className = "steps trace";
        d.innerHTML = `<summary>🛠 调试 trace (${m.trace.length})</summary>` +
          `<table class="tracetbl">${m.trace.map(traceRow).join("")}</table>`;
        div.appendChild(d);
      }
    }
    messagesEl.appendChild(div);
  });
  $("chat").scrollTop = $("chat").scrollHeight;
  typesetMath();
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

// 把一条结构化 trace 事件渲染成表格行：类型徽标 + 关键字段摘要
function traceRow(e) {
  const t = e.type || "?";
  let detail;
  if (t === "llm") {
    detail = `第${e.step}轮 · in ${e.tokens_in}/out ${e.tokens_out} tok（累计 ${e.total_tokens}）· stop=${e.stop}`;
  } else if (t === "tool") {
    const arg = JSON.stringify(e.input || {});
    detail = `${e.tool} ${arg} · ${e.ok ? "✓" : "✗"} ${e.n_sources || 0}源 · ${e.duration_ms || 0}ms` +
      (e.attempts > 1 ? ` · ${e.attempts}次` : "") + (e.error ? ` · ${escapeHtml(e.error)}` : "");
  } else if (t === "verify") {
    detail = `${e.result}` + (e.hallucinated && e.hallucinated.length ? ` · 编造 ${e.hallucinated.join(",")}` : "") +
      (e.valid && e.valid.length ? ` · 有效 ${e.valid.join(",")}` : "") + (e.mode ? ` · ${e.mode}` : "");
  } else if (t === "rewrite") {
    detail = `${escapeHtml(e.original || "")} → ${escapeHtml(e.standalone || "")}`;
  } else if (t === "context") {
    detail = `注入历史 ${e.history_turns} 轮`;
  } else if (t === "budget") {
    detail = `token 预算用尽 ${e.total_tokens}/${e.budget}`;
  } else {
    detail = escapeHtml(JSON.stringify(e));
  }
  return `<tr><td class="tk">${escapeHtml(t)}</td><td>${detail}</td></tr>`;
}

// ---------- 自动标题 ----------
async function maybeTitle(s) {
  if (s.title) return;
  const turns = s.messages
    .filter(m => m.role === "user" || m.role === "assistant")
    .slice(0, 2)
    .map(m => ({ role: m.role, content: m.content }));
  if (!turns.length) return;
  try {
    const r = await fetch(`${API}/title`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: turns }),
    });
    if (r.ok) {
      const data = await r.json();
      if (data.title) { s.title = data.title; saveStore(); renderSessions(); return; }
    }
  } catch (_) {}
  // 降级：截取首条用户消息
  const fu = s.messages.find(m => m.role === "user");
  if (fu) { s.title = fu.content.slice(0, 16); saveStore(); renderSessions(); }
}

// ---------- 发送 ----------
async function send() {
  const input = $("input");
  const q = input.value.trim();
  if (!q) return;
  const s = activeSession();
  if (!s) return;

  // 把当前会话已有轮次作为历史（仅文本），用于后端历史注入 + 指代消解
  const history = s.messages.map(m => ({ role: m.role, content: m.content }));

  s.messages.push({ role: "user", content: q });
  s.updatedAt = Date.now();
  input.value = ""; input.style.height = "auto";
  saveStore(); render(); renderSessions(); setSending(true);

  const thinking = document.createElement("div");
  thinking.className = "msg assistant";
  thinking.innerHTML = `<div class="role">助手</div><div class="typing">正在检索并生成…</div>`;
  messagesEl.appendChild(thinking);
  $("chat").scrollTop = $("chat").scrollHeight;

  try {
    const r = await fetch(`${API}/ask`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, history }),
    });
    if (!r.ok) {
      const t = await r.text();
      s.messages.push({ role: "assistant", content: `⚠️ 请求失败 (${r.status})：${t}`, steps: [] });
    } else {
      const data = await r.json();
      s.messages.push({
        role: "assistant", content: data.answer || "(空回答)",
        steps: data.steps || [], trace: data.trace || [],
      });
    }
  } catch (e) {
    s.messages.push({ role: "assistant", content: `⚠️ 网络错误：${e}`, steps: [] });
  } finally {
    s.updatedAt = Date.now();
    setSending(false);
    saveStore(); render();
    maybeTitle(s); // 首轮问答后自动起标题
  }
}
function setSending(b) { $("send").disabled = b; }

// ---------- 事件 ----------
$("send").addEventListener("click", send);
$("newchat").addEventListener("click", () => { newSession(); renderSessions(); render(); $("input").focus(); });
$("toggle-sidebar").addEventListener("click", () => document.body.classList.toggle("nosidebar"));

const input = $("input");
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 200) + "px";
});

// ---------- 启动 ----------
loadStore();
renderSessions();
render();
</script>
</body>
</html>
