project:
  name: paper-rag-agent
  data_root: ./data/papers

index:
  index_root: ./data/indexes
  chunk_size: 1400
  chunk_overlap: 140
  top_k_recall: 8
  top_n_rerank: 3
  rrf_k: 60
  max_chunks_per_parent: 2

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  use_sentence_transformers: true
  fallback_dimension: 384

rerank:
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  use_cross_encoder: false

retrieval:
  low_confidence_threshold: 0.0
  weak_confidence_threshold: 0.0
  min_confident_sources: 1
  answerability_min_sources: 1
  answerability_min_score: -1000000000.0
  answerability_min_confidence: 0.0
  answerability_require_citation: false
  max_corrections: 0
  cjk_ngram_size: 2
  deduplicate_evidence: true
  conflict_detection: false
  claim_support_min_overlap: 0.0

mineru:
  api_base_url: http://127.0.0.1:8001
  version: 3.4.4
  backend: hybrid-engine
  effort: high
  supported_version_prefix: "3.4."
  connect_timeout_seconds: 5
  request_timeout_seconds: 30
  max_request_retries: 2
  parse_timeout_seconds: 900
  poll_interval_seconds: 2
  max_pdf_mb: 30
  max_pages: 300
  max_output_mb: 250
  max_archive_entries: 3000
  cache_root: ./data/mineru-cache
  proposal_ttl_seconds: 900
  job_db_path: ./data/ingest_jobs.sqlite3
  max_pending_jobs: 8
  max_concurrent_jobs: 1

llm:
  model_name: deepseek-v4-flash
  max_tokens: 768
  openai_api_base: https://api.deepseek.com
  openai_api_key: ""
  request_timeout_seconds: 60
  connect_timeout_seconds: 5
  max_retries: 0

arxiv:
  max_results: 3
  max_ingest_papers: 1
  max_pdf_mb: 30
  max_papers: 200
  max_age_days: 0
  request_timeout_seconds: 15

agent:
  token_budget: 12000
  tool_result_max_chars: 5000
  source_snippet_chars: 350
  history_max_messages: 6
  history_max_chars: 5000
  history_summary_max_chars: 1200
  memory_ttl_seconds: 604800
  memory_max_sessions: 500
  memory_db_path: ./data/sessions.sqlite3
  recent_history_messages: 4
  max_model_calls: 2
  max_graph_steps: 24
  max_tool_calls: 2
  max_local_search_calls: 1
  max_inspect_calls: 1
  max_arxiv_search_calls: 1
  max_total_sources: 5
  max_total_tool_result_chars: 8000
  final_max_sources: 3
  final_max_sources_per_paper: 2
  final_reuse_max_chars: 4000
  trace_value_max_chars: 500
  fast_local_enabled: true
  fast_local_min_confidence: 0.35
  prewarm_on_startup: true

app:
  database_path: ./data/app.sqlite3
  users_root: ./data/users
  secrets_root: ./data/secrets
  session_cookie_name: paper_rag_session
  session_ttl_seconds: 604800
  password_min_length: 10
  max_login_failures: 5
  login_lock_seconds: 900
  max_papers_per_user: 200
  max_pending_jobs_per_user: 3
  max_model_profiles_per_user: 10
  # Clash/Mihomo fake-IP 会解析到 198.18.0.0/15；本地版默认不对域名做公网 IP 判定。
  # 开启后会恢复严格 DNS/SSRF 校验，但使用 fake-IP 代理时可能误报。
  enforce_public_dns_for_model_endpoints: false
  allowed_local_llm_endpoints:
    - http://127.0.0.1:11434/v1
