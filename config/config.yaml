project:
  name: paper-rag-agent
  data_root: ./data/papers

index:
  index_root: ./data/indexes
  # 论文按字符窗口切块（尽量落在段落边界），比按行更适合自然语言
  # FinanceBench baseline：1400/10% 在命中率、MRR 和 chunk 数上综合最佳。
  chunk_size: 1400
  chunk_overlap: 140
  # 召回 20 条供 CrossEncoder 重排，最终仅保留 5 条进入生成上下文。
  top_k_recall: 20
  top_n_rerank: 5
  rrf_k: 60
  max_chunks_per_parent: 2

# 模型名写 HF 全名即可：若 models/<名> 下有本地副本则自动优先用本地（离线、可移植），
# 否则回退在线下载（见 config/settings.py:resolve_model_path）。
embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  use_sentence_transformers: true
  fallback_dimension: 384

rerank:
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  use_cross_encoder: true

retrieval:
  # 低置信判据：分数先经 sigmoid 归一化为「相关概率」(0~1)，与 reranker 量纲解耦。
  # 判为低置信（触发有界二次检索）当：最高分概率 < 强阈值，或 概率≥弱阈值的来源不足 min_confident_sources 条。
  # 下列阈值按 CrossEncoder 开（默认，分数为 CE logit）标定；CE 关（降级 token+余弦≈0~2）需另行重标定。
  low_confidence_threshold: 0.5    # 强阈值（相关概率）：sigmoid(CE logit=0)=0.5
  weak_confidence_threshold: 0.35  # 弱阈值（相关概率）
  min_confident_sources: 1         # 概率≥弱阈值的来源至少这么多条
  answerability_min_sources: 1     # 硬闸：低置信/二次检索后仍少于 N 条有效来源则拒答
  answerability_min_score: 0.0     # 可比分数最低要求；score=None 的精读/页面工具来源按有效来源处理
  answerability_min_confidence: 0.25
  answerability_require_citation: true
  # 引用核查失败 / 低置信时，自动二次检索的最大次数（有界，避免无限多跳）。
  max_corrections: 1
  cjk_ngram_size: 2
  deduplicate_evidence: true
  conflict_detection: true

pdf_parse:
  # provider: pymupdf | tesseract（tesseract 为可选本地 OCR runtime，缺失时自动降级）
  provider: pymupdf
  auto_ocr: false
  timeout_seconds: 30

image_search:
  enabled: true
  # 在线 arXiv 入库时不重画全部页面；手动 build_index.py 仍会更新图像索引。
  rebuild_on_ingest: false
  max_pages: 80
  max_side: 256
  max_query_base64_chars: 2000000

llm:
  model_name: deepseek-v4-flash
  max_tokens: 2048
  max_tool_iters: 6       # agentic loop 最大轮次
  openai_api_base: "https://api.deepseek.com"
  # 密钥绝不写进此文件：留空，从环境变量 OPENAI_API_KEY 读取（见 llm/model.py）
  openai_api_key: ""
  request_timeout_seconds: 120
  connect_timeout_seconds: 30
  max_retries: 2

arxiv:
  max_results: 5
  max_ingest_papers: 1          # 在线问答每轮只入库最相关的一篇，避免长时间阻塞
  max_pdf_mb: 30                # 单篇 PDF 体积上限（MB），超出跳过
  ingest_timeout_seconds: 120   # 下载+增量嵌入+重检索的专属超时（含网络/推理）
  max_papers: 200               # 在线入库论文容量上限；手动放入 papers 的论文不自动淘汰；0=不限
  max_age_days: 0               # 超 N 天未被检索命中即淘汰；0=不按龄期淘汰
  request_timeout_seconds: 60   # arXiv 搜索/下载单次网络请求超时
  # 新论文即时检索使用轻量 token 重排，避免在隔离进程再次加载 CrossEncoder。
  use_cross_encoder_after_ingest: false

harness:
  tool_timeout_seconds: 30   # 单次工具调用超时
  tool_max_retries: 1        # 工具失败/超时的重试次数
  token_budget: 60000        # 累计 input+output token 上限，超出则停止多跳
  tool_result_max_chars: 24000
  source_snippet_chars: 600
  image_base64_chars: 12000
  history_max_messages: 12
  history_max_chars: 12000
  history_summary_max_chars: 2000
  context_max_chars: 60000
  clarification_enabled: true
  memory_ttl_seconds: 604800
  memory_max_sessions: 500
  memory_db_path: ./data/sessions.sqlite3
  clarification_min_chars: 6
  recent_history_messages: 8
  claim_support_min_overlap: 0.12
  pdf_page_max_side: 2400
  pdf_region_max_side: 1600

evaluation:
  # 由实际供应商价格填写；0 表示评测时只统计 token，不换算费用。
  input_price_per_million: 0
  output_price_per_million: 0
