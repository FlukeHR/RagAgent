project:
  name: paper-rag-agent
  data_root: ./data/papers
  default_collection: demo

index:
  index_root: ./data/indexes
  # 论文按字符窗口切块（尽量落在段落边界），比按行更适合自然语言
  chunk_size: 900
  chunk_overlap: 150
  top_k_recall: 12
  top_n_rerank: 5

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  use_sentence_transformers: true

rerank:
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  use_cross_encoder: false

llm:
  # provider: anthropic | openai | local
  provider: openai
  model_name: deepseek-v4-flash
  max_tokens: 2048
  effort: medium          # low | medium | high | xhigh | max
  max_tool_iters: 6       # agentic loop 最大轮次
  openai_api_base: "https://api.deepseek.com"
  openai_api_key: "sk-cc085cde25db46a78c8a9e04db9e7bfc"

arxiv:
  max_results: 5
  download_dir: ./data/papers/arxiv
